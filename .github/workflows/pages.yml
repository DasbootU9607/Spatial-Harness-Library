name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: maze-harness

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify all rooms, saved routes, and provenance
        run: node scripts/check-site.cjs
      - name: Verify incremental skill discovery
        run: node scripts/test-site-sync.cjs
      - name: Verify model attribution and build identity
        run: |
          node scripts/test-build-models.cjs
          node scripts/test-home-builds.cjs
      - name: Verify candidate screenshot bindings
        run: node scripts/test-process-thumbnails.cjs
      - name: Verify authoring recorder and public evidence projection
        run: |
          node --test tools/authoring-observatory/tests/*.test.cjs
          node scripts/test-authoring-integration.cjs
          node scripts/test-authoring-process.cjs
          node scripts/test-process-uncertain-history.cjs
          node scripts/test-process-recovery.cjs
          node scripts/test-process-actions.cjs
      - name: Assemble the library and four harness sites
        working-directory: .
        run: node .github/scripts/build-pages.cjs "${{ runner.temp }}/library-preview/Spatial-Harness-Library"
      - name: Verify shared schemas, evidence and immutable publication
        working-directory: .
        run: |
          node tools/check.cjs
          node --test tools/observatory/tests/*.test.cjs
      - name: Install browser checks
        working-directory: .
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check all harnesses under the actual Pages subpath
        working-directory: .
        run: node tools/browser-check.cjs --root "${{ runner.temp }}/library-preview" --out "${{ runner.temp }}/browser-evidence"
      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/library-preview/Spatial-Harness-Library
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
