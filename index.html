<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reusable agent skills and tools for creating and verifying spatial reasoning tasks.">
  <title>Spatial Harness Library</title>
  <link rel="stylesheet" href="./shared/exhibition.css">
  <link rel="stylesheet" href="./library.css">
  <script type="module" src="./chooser.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <main id="main">
    <section class="library-intro">
      <h1><a href="https://github.com/DasbootU9607/Spatial-Harness-Library" aria-label="Spatial Harness Library on GitHub">Spatial Harness Library</a></h1>
      <p>A library for creating and testing spatial reasoning tasks.</p>
      <p class="library-explainer">Each harness brings together a benchmark, reusable agent skills, and tools to build and verify new tasks.</p>
    </section>
    <section id="harnesses" class="library-carousel" aria-label="Explore the harnesses" aria-roledescription="carousel">
      <div class="carousel-stage">
        <button id="previous" class="carousel-arrow" aria-label="Previous harness">←</button>
        <div id="harness-slides" class="harness-slides" tabindex="0" aria-label="Harness previews. Use left and right arrow keys or swipe."><p role="status">Loading harnesses…</p></div>
        <button id="next" class="carousel-arrow" aria-label="Next harness">→</button>
      </div>
      <p id="carousel-status" class="visually-hidden" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
