<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A library for creating and testing spatial reasoning tasks.">
  <title>Spatial Harness Library</title>
  <link rel="stylesheet" href="./library.css">
</head>
<body>
  <main>
    <h1>Spatial Harness Library</h1>
    <p>A library for creating and testing spatial reasoning tasks.</p>
    <details class="chooser">
      <summary aria-label="Choose a harness">Choose <span class="slot" aria-hidden="true">(<svg viewBox="0 0 12 8" width="12" height="8"><path d="m1 1 5 5 5-5"/></svg>)</span> Harness</summary>
      <nav aria-label="Harnesses">
        <a href="./maze-harness/">Maze Harness</a>
        <a href="./spatialviz-harness/">SpatialViz Harness</a>
        <a href="./babyvision-harness/">BabyVision Harness</a>
        <a href="./spatialb-harness/">SpatialB Harness</a>
      </nav>
    </details>
  </main>
  <script>
    const chooser = document.querySelector('.chooser');
    document.addEventListener('click', event => {
      if (!chooser.contains(event.target)) chooser.open = false;
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && chooser.open) {
        chooser.open = false;
        chooser.querySelector('summary').focus();
      }
    });
  </script>
</body>
</html>
