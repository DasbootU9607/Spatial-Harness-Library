<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1042" viewBox="0 0 940 1042"><rect x="0" y="0" width="940" height="1042" rx="4" fill="#fffcf5" stroke="none"/><text x="26" y="32" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#096b5e">MECHANICAL SYSTEM   /   ASSEMBLY STUDY</text><text x="26" y="68" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#193742">Drive A   CW</text><text x="26" y="98" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#193742">Find C (spin) and Y (horizontal) at the shown instant.</text><text x="26" y="125" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#193742">CW is clockwise looking into each marked plane. All outputs are relative to the frame.</text><text x="26" y="149" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#193742">Numbered flags locate working contacts. Crossings without a flag transmit no motion.</text><rect x="30" y="168" width="208" height="392" rx="4" fill="#f1f4ee" stroke="none"/><text x="40" y="189" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#096b5e">PLANE 0   ·   FRONT</text><rect x="257" y="168" width="232" height="392" rx="4" fill="#f1f4ee" stroke="none"/><text x="267" y="189" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#096b5e">PLANE 1   ·   FRONT</text><circle cx="134" cy="332" r="60" fill="#badbd2" stroke="#193742" stroke-width="1.7"/><circle cx="134" cy="332" r="4.1" fill="#fffcf5" stroke="#193742" stroke-width="1.7"/><circle cx="134" cy="452" r="60" fill="#badbd2" stroke="#193742" stroke-width="1.7"/><circle cx="134" cy="452" r="4.1" fill="#fffcf5" stroke="#193742" stroke-width="1.7"/><path d="M373 332 L373 260" stroke="#096b5e" stroke-width="7" fill="none"/><circle cx="373" cy="260" r="3" fill="#fffcf5" stroke="#193742" stroke-width="1.7"/><circle cx="373" cy="332" r="4.1" fill="#fffcf5" stroke="#193742" stroke-width="1.7"/><rect x="337" y="244.88" width="72" height="30.24" rx="4" fill="#dbbf99" stroke="#193742"/><path d="M326.2 282.32 L419.8 282.32" stroke="#193742" stroke-width="1.5" fill="none"/><circle cx="373" cy="452" r="48" fill="#badbd2" stroke="#193742" stroke-width="1.7"/><circle cx="373" cy="452" r="4.1" fill="#fffcf5" stroke="#193742" stroke-width="1.7"/><path d="M134 332 L134 452" fill="none" stroke="#986a43" stroke-width="2" stroke-dasharray="5 4"/><circle cx="134" cy="392" r="3" fill="#a04418" stroke="#193742" stroke-width="1.7"/><path d="M134 452 L373 452" fill="none" stroke="#fffcf5" stroke-width="8"/><path d="M134 452 L373 452" fill="none" stroke="#556c70" stroke-width="2" stroke-dasharray="7 5"/><polygon points="244.5,445 259.5,452 244.5,459" fill="#cd8a53" stroke="#193742" stroke-width="1"/><path d="M260.5 443 L260.5 461" stroke="#193742" stroke-width="3" fill="none"/><path d="M134 332 L373 332" fill="none" stroke="#fffcf5" stroke-width="8"/><path d="M134 332 L373 332" fill="none" stroke="#556c70" stroke-width="4"/><rect x="240.5" y="328" width="26" height="8" rx="4" fill="#096b5e" stroke="#193742"/><path d="M373 332 L373 260" stroke="#096b5e" stroke-width="6" fill="none"/><circle cx="373" cy="332" r="4" fill="#fffcf5" stroke="#193742" stroke-width="1.7"/><path d="M373 250 L373 272" stroke="#b58a59" stroke-width="11" fill="none"/><path d="M373 251 L373 270" stroke="#fffcf5" stroke-width="4" fill="none"/><path d="M373 270 L373 260" stroke="#9f794f" stroke-width="3" fill="none"/><path d="M357 266 L389 266" stroke="#193742" stroke-width="2" fill="none"/><path d="M357 254 L389 254" stroke="#193742" stroke-width="2" fill="none"/><circle cx="373" cy="260" r="3.5" fill="#a04418" stroke="#193742" stroke-width="1.7"/><path d="M134 392 L152 376" stroke="#a04418" stroke-width="1.3" fill="none"/><circle cx="152" cy="376" r="9.5" fill="#a04418" stroke="#fffcf5" stroke-width="1"/><text x="149" y="380" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="white">1</text><path d="M253.5 452 L271.5 436" stroke="#a04418" stroke-width="1.3" fill="none"/><circle cx="271.5" cy="436" r="9.5" fill="#a04418" stroke="#fffcf5" stroke-width="1"/><text x="268.5" y="440" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="white">2</text><path d="M253.5 332 L271.5 316" stroke="#a04418" stroke-width="1.3" fill="none"/><circle cx="271.5" cy="316" r="9.5" fill="#a04418" stroke="#fffcf5" stroke-width="1"/><text x="268.5" y="320" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="white">3</text><path d="M373 260 L391 244" stroke="#a04418" stroke-width="1.3" fill="none"/><circle cx="391" cy="244" r="9.5" fill="#a04418" stroke="#fffcf5" stroke-width="1"/><text x="388" y="248" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="white">4</text><path d="M134 332 L155.14730734955464 354.52230254560766" stroke="#78908c" stroke-width="1" fill="none"/><text x="154.147" y="359.522" font-family="Arial,sans-serif" font-size="13" font-weight="700" stroke="#fffcf5" stroke-width="3.5" paint-order="stroke" fill="#096b5e">A wheel IN</text><path d="M134 452 L144 486" stroke="#78908c" stroke-width="1" fill="none"/><text x="143" y="491" font-family="Arial,sans-serif" font-size="13" font-weight="700" stroke="#fffcf5" stroke-width="3.5" paint-order="stroke" fill="#193742">B wheel</text><path d="M373 332 L383 366" stroke="#78908c" stroke-width="1" fill="none"/><text x="382" y="371" font-family="Arial,sans-serif" font-size="13" font-weight="700" stroke="#fffcf5" stroke-width="3.5" paint-order="stroke" fill="#193742">K crank</text><path d="M373 260 L383 293.6" stroke="#78908c" stroke-width="1" fill="none"/><text x="382" y="298.6" font-family="Arial,sans-serif" font-size="13" font-weight="700" stroke="#fffcf5" stroke-width="3.5" paint-order="stroke" fill="#193742">Y slider OUT</text><path d="M373 452 L383 486" stroke="#78908c" stroke-width="1" fill="none"/><text x="382" y="491" font-family="Arial,sans-serif" font-size="13" font-weight="700" stroke="#fffcf5" stroke-width="3.5" paint-order="stroke" fill="#193742">C rotor OUT</text><text x="26" y="599" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#096b5e">CONTACTS AND CONSTRAINTS</text><rect x="26" y="606" width="434" height="124" rx="4" fill="#f0f4ef" stroke="none"/><text x="36" y="626" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#a04418">Contact 1</text><g transform="translate(26 633) scale(.77)"><polygon points="40,48 85,43 98,69 52,74" fill="#a8d9cc" stroke="#193742" stroke-width="2"/><polygon points="99,67 136,49 173,62 135,81" fill="#f3c895" stroke="#193742" stroke-width="2"/><circle cx="98" cy="67" r="3" fill="#193742" stroke="#193742" stroke-width="2"/><text x="30" y="35" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">A CW  →</text><text x="118" y="102" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">B CW  →</text></g><text x="190" y="648" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#096b5e">Shaft-end views</text><text x="190" y="669" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">Double face wheel.</text><text x="190" y="686" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">Arrows show each CW tangent</text><text x="190" y="703" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">from its labeled shaft end.</text><rect x="470" y="606" width="434" height="124" rx="4" fill="#f0f4ef" stroke="none"/><text x="480" y="626" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#a04418">Contact 2</text><text x="482" y="648" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#096b5e">Overrunning clutch</text><text x="482" y="669" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">B drives clutch on C.</text><text x="482" y="686" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">Locks CW, overruns CCW.</text><text x="482" y="703" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">Holding brake in overrun.</text><rect x="26" y="738" width="434" height="124" rx="4" fill="#f0f4ef" stroke="none"/><text x="36" y="758" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#a04418">Contact 3</text><text x="38" y="780" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#096b5e">Keyed shaft</text><text x="38" y="801" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">A and K on one shaft.</text><text x="38" y="818" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">Solid key joins both hubs.</text><rect x="470" y="738" width="434" height="124" rx="4" fill="#f0f4ef" stroke="none"/><text x="480" y="758" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#a04418">Contact 4</text><g transform="translate(470 765) scale(.77)"><rect x="100" y="18" width="20" height="67" rx="4" fill="#f0c798" stroke="#193742"/><rect x="106" y="23" width="8" height="57" rx="4" fill="#fffefa" stroke="none"/><path d="M121 51 L182 51" stroke="#b56426" stroke-width="7" fill="none"/><path d="M154 45 L182 45" stroke="#193742" stroke-width="3" fill="none"/><path d="M154 57 L182 57" stroke="#193742" stroke-width="3" fill="none"/><path d="M110 78 L110 44" stroke="#0a796a" stroke-width="7" fill="none"/><circle cx="110" cy="78" r="5" fill="#fffefa" stroke="#193742" stroke-width="2"/><circle cx="110" cy="44" r="5" fill="#fffefa" stroke="#193742" stroke-width="2"/><text x="52" y="102" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">K</text><text x="168" y="71" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">Y</text></g><text x="634" y="780" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#096b5e">Captive yoke</text><text x="634" y="801" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">Top pin on crank K rides the</text><text x="634" y="818" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">vertical slot of horizontal yoke Y.</text><text x="634" y="835" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">Throw radius 12 mm.</text><path d="M26 880 L914 880" stroke="#9eafa9" stroke-width="1" fill="none"/><text x="27" y="909" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#a04418">A</text><text x="57" y="909" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#193742">C stationary / Y stationary</text><text x="27" y="941" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#a04418">B</text><text x="57" y="941" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#193742">C CW / Y stationary</text><text x="27" y="973" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#a04418">C</text><text x="57" y="973" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#193742">C stationary / Y right</text><text x="27" y="1005" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#a04418">D</text><text x="57" y="1005" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#193742">C CW / Y right</text></svg>
