<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1063" viewBox="0 0 940 1063"><rect x="0" y="0" width="940" height="1063" rx="4" fill="#fffcf5" stroke="none"/><text x="26" y="32" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#096b5e">MECHANICAL SYSTEM   /   ASSEMBLY STUDY</text><text x="26" y="68" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#193742">Drive A   CW</text><text x="26" y="98" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#193742">Find C (spin) and Y (horizontal) at the shown instant.</text><text x="26" y="125" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#193742">CW is clockwise looking into each marked plane. All outputs are relative to the frame.</text><text x="26" y="149" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#193742">Numbered flags locate working contacts. Crossings without a flag transmit no motion.</text><rect x="246" y="168" width="208" height="392" rx="4" fill="#f1f4ee" stroke="none"/><text x="256" y="189" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#096b5e">PLANE 0   ·   FRONT</text><rect x="473" y="168" width="232" height="392" rx="4" fill="#f1f4ee" stroke="none"/><text x="483" y="189" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#096b5e">PLANE 1   ·   FRONT</text><circle cx="350" cy="332" r="7" fill="#badbd2" stroke="#193742" stroke-width="1.7"/><circle cx="350" cy="332" r="2" fill="#193742" stroke="#193742" stroke-width="1.7"/><circle cx="350" cy="332" r="4.1" fill="#fffcf5" stroke="#193742" stroke-width="1.7"/><circle cx="350" cy="452" r="7" fill="#badbd2" stroke="#193742" stroke-width="1.7"/><circle cx="350" cy="452" r="2" fill="#193742" stroke="#193742" stroke-width="1.7"/><circle cx="350" cy="452" r="4.1" fill="#fffcf5" stroke="#193742" stroke-width="1.7"/><path d="M