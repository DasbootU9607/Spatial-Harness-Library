dth="1"/><text x="409" y="380" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="white">1</text><path d="M469.5 452 L487.5 436" stroke="#a04418" stroke-width="1.3" fill="none"/><circle cx="487.5" cy="436" r="9.5" fill="#a04418" stroke="#fffcf5" stroke-width="1"/><text x="484.5" y="440" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="white">2</text><path d="M469.5 332 L487.5 316" stroke="#a04418" stroke-width="1.3" fill="none"/><circle cx="487.5" cy="316" r="9.5" fill="#a04418" stroke="#fffcf5" stroke-width="1"/><text x="484.5" y="320" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="white">3</text><path d="M589 260 L607 244" stroke="#a04418" stroke-width="1.3" fill="none"/><circle cx="607" cy="244" r="9.5" fill="#a04418" stroke="#fffcf5" stroke-width="1"/><text x="604" y="248" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="white">4</text><path d="M350 332 L371.14730734955464 354.52230254560766" stroke="#78908c" stroke-width="1" fill="none"/><text x="370.147" y="359.522" font-family="Arial,sans-serif" font-size="13" font-weight="700" stroke="#fffcf5" stroke-width="3.5" paint-order="stroke" fill="#096b5e">A wheel IN</text><path d="M350 452 L360 486" stroke="#78908c" stroke-width="1" fill="none"/><text x="359" y="491" font-family="Arial,sans-serif" font-size="13" font-weight="700" stroke="#fffcf5" stroke-width="3.5" paint-order="stroke" fill="#193742">B wheel</text><path d="M589 332 L599 366" stroke="#78908c" stroke-width="1" fill="none"/><text x="598" y="371" font-family="Arial,sans-serif" font-size="13" font-weight="700" stroke="#fffcf5" stroke-width="3.5" paint-order="stroke" fill="#193742">K crank</text><path d="M589 260 L599 293.6" stroke="#78908c" stroke-width="1" fill="none"/><text x="598" y="298.6" font-family="Arial,sans-serif" font-size="13" font-weight="700" stroke="#fffcf5" stroke-width="3.5" paint-order="stroke" fill="#193742">Y slider OUT</text><path d="M589 452 L599 486" stroke="#78908c" stroke-width="1" fill="none"/><text x="598" y="491" font-family="Arial,sans-serif" font-size="13" font-weight="700" stroke="#fffcf5" stroke-width="3.5" paint-order="stroke" fill="#193742">C rotor OUT</text><text x="26" y="620" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#096b5e">CONTACTS AND CONSTRAINTS</text><rect x="26" y="627" width="434" height="124" rx="4" fill="#f0f4ef" stroke="none"/><text x="36" y="647" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#a04418">Contact 1</text><g transform="translate(26 654) scale(.77)"><polygon points="40,48 85,43 98,69 52,74" fill="#a8d9cc" stroke="#193742" stroke-width="2"/><polygon points="99,67 136,49 173,62 135,81" fill="#f3c895" stroke="#193742" stroke-width="2"/><circle cx="98" cy="67" r="3" fill="#193742" stroke="#193742" stroke-width="2"/><text x="30" y="35" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">A CW  →</text><text x="118" y="102" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">B CW  →</text></g><text x="190" y="669" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#096b5e">Shaft-end views</text><text x="190" y="690" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">Double face wheel.</text><text x="190" y="707" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">Arrows show each CW tangent</text><text x="190" y="724" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">from its labeled shaft end.</text><text x="190" y="741" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">Near seat engaged.</text><rect x="470" y="627" width="434" height="124" rx="4" fill="#f0f4ef" stroke="none"/><text x="480" y="647" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#a04418">Contact 2</text><text x="482" y="669" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#096b5e">Overrunning clutch</text><text x="482" y="690" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">B drives clutch on C.</text><text x="482" y="707" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">Locks CW, overruns CCW.</text><text x="482" y="724" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">Holding brake in overrun.</text><rect x="26" y="759" width="434" height="124" rx="4" fill="#f0f4ef" stroke="none"/><text x="36" y="779" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#a04418">Contact 3</text><text x="38" y="801" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#096b5e">Keyed shaft</text><text x="38" y="822" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">A and K on one shaft.</text><text x="38" y="839" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">Solid key joins both hubs.</text><rect x="470" y="759" width="434" height="124" rx="4" fill="#f0f4ef" stroke="none"/><text x="480" y="779" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#a04418">Contact 4</text><g transform="translate(470 786) scale(.77)"><rect x="100" y="18" width="20" height="67" rx="4" fill="#f0c798" stroke="#193742"/><rect x="106" y="23" width="8" height="57" rx="4" fill="#fffefa" stroke="none"/><path d="M121 51 L182 51" stroke="#b56426" stroke-width="7" fill="none"/><path d="M154 45 L182 45" stroke="#193742" stroke-width="3" fill="none"/><path d="M154 57 L182 57" stroke="#193742" stroke-width="3" fill="none"/><path d="M110 78 L110 44" stroke="#0a796a" stroke-width="7" fill="none"/><circle cx="110" cy="78" r="5" fill="#fffefa" stroke="#193742" stroke-width="2"/><circle cx="110" cy="44" r="5" fill="#fffefa" stroke="#193742" stroke-width="2"/><text x="52" y="102" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">K</text><text x="168" y="71" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">Y</text></g><text x="634" y="801" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#096b5e">Captive yoke</text><text x="634" y="822" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">Top pin on crank K rides the</text><text x="634" y="839" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">vertical slot of horizontal yoke Y.</text><text x="634" y="856" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#193742">Throw radius 12 mm.</text><path d="M26 901 L914 901" stroke="#9eafa9" stroke-width="1" fill="none"/><text x="27" y="930" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#a04418">A</text><text x="57" y="930" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#193742">C stationary / Y stationary</text><text x="27" y="962" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#a04418">B</text><text x="57" y="962" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#193742">C CW / Y stationary</text><text x="27" y="994" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#a04418">C</text><text x="57" y="994" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#193742">C stationary / Y right</text><text x="27" y="1026" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#a04418">D</text><text x="57" y="1026" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#193742">C CW / Y right</text></svg>
