<svg xmlns="http://www.w3.org/2000/svg" width="640" height="474" viewBox="0 0 640 474"><rect x="0" y="0" width="640" height="474" rx="4" fill="#fffefa" stroke="none"/><text x="24" y="31" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#0a796a">MECHANICAL SYSTEM   /   MOTION STUDY</text><text x="24" y="67" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#193742">Drive A   right</text><text x="24" y="96" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#193742">Find B (diagonal) at the shown instant.</text><text x="24" y="123" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">CW = clockwise in the marked view. Matching letters denote one body.</text><text x="24" y="146" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">Detail views use pitch outlines. Only the labeled joints transmit motion.</text><rect x="24" y="178" width="446" height="119" rx="4" fill="#f1f5f1" stroke="none"/><g transform="translate(24 191) scale(.86)"><path d="M31 48 L158 48" stroke="#0a796a" stroke-width="12" fill="none"/><path d="M84 21 L158 92" stroke="#b56426" stroke-width="12" fill="none"/><path d="M105 40 L105 62" stroke="#193742" stroke-width="5" fill="none"/><text x="25" y="31" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">A</text><text x="167" y="90" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">B</text></g><text x="203" y="202" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#0a796a">Rack guides</text><text x="203" y="226" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">A horizontal, B on SE rail.</text><text x="203" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">Engaged tooth flanks have a</text><text x="203" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">horizontal common normal.</text><path d="M24 324 L616 324" stroke="#b5c9c3" stroke-width="1" fill="none"/><text x="27" y="356" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#b56426">A</text><text x="57" y="356" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">up-right</text><text x="27" y="384" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#b56426">B</text><text x="57" y="384" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">down-left</text><text x="27" y="412" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#b56426">C</text><text x="57" y="412" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">up-left</text><text x="27" y="440" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#b56426">D</text><text x="57" y="440" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">down-right</text></svg>
