<svg xmlns="http://www.w3.org/2000/svg" width="966" height="474" viewBox="0 0 966 474"><rect x="0" y="0" width="966" height="474" rx="4" fill="#fffefa" stroke="none"/><text x="24" y="31" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#0a796a">MECHANICAL SYSTEM   /   MOTION STUDY</text><text x="24" y="67" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#193742">Drive A   CW</text><text x="24" y="96" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#193742">Find K (spin) at the shown instant.</text><text x="24" y="123" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">CW = clockwise in the marked view. Matching letters denote one body.</text><text x="24" y="146" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">Detail views use pitch outlines. Only the labeled joints transmit motion.</text><rect x="24" y="178" width="446" height="119" rx="4" fill="#f1f5f1" stroke="none"/><g transform="translate(24 191) scale(.86)"><polygon points="40,48 85,43 98,69 52,74" fill="#a8d9cc" stroke="#193742" stroke-width="2"/><polygon points="99,67 136,49 173,62 135,81" fill="#f3c895" stroke="#193742" stroke-width="2"/><circle cx="98" cy="67" r="3" fill="#193742" stroke="#193742" stroke-width="2"/><text x="30" y="35" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">A CW  →</text><text x="118" y="102" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">B CW  →</text></g><text x="203" y="202" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#0a796a">Shaft-end views</text><text x="203" y="226" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">Local tooth-contact section.</text><text x="203" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">Arrows show each CW tangent</text><text x="203" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">from its labeled shaft end.</text><rect x="479" y="178" width="446" height="119" rx="4" fill="#f1f5f1" stroke="none"/><g transform="translate(479 191) scale(.86)"><rect x="34" y="50" width="169" height="14" rx="4" fill="#a1b4b7" stroke="#193742"/><rect x="75" y="31" width="15" height="50" rx="4" fill="#99d1c1" stroke="#193742"/><rect x="150" y="31" width="15" height="50" rx="4" fill="#eab880" stroke="#193742"/><rect x="75" y="43" width="90" height="8" rx="4" fill="#193742" stroke="none"/></g><text x="658" y="202" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#0a796a">Keyed shaft</text><text x="658" y="226" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">B and K on one shaft.</text><text x="658" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">Solid key joins both hubs.</text><path d="M24 324 L942 324" stroke="#b5c9c3" stroke-width="1" fill="none"/><text x="27" y="356" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#b56426">A</text><text x="57" y="356" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">stationary</text><text x="27" y="384" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#b56426">B</text><text x="57" y="384" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">CCW</text><text x="27" y="412" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#b56426">C</text><text x="57" y="412" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">CW</text><text x="27" y="440" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#b56426">D</text><text x="57" y="440" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">translates</text></svg>
