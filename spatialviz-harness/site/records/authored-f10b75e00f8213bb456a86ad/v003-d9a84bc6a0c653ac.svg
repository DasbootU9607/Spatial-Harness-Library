<svg xmlns="http://www.w3.org/2000/svg" width="640" height="474" viewBox="0 0 640 474"><rect x="0" y="0" width="640" height="474" rx="4" fill="#fffefa" stroke="none"/><text x="24" y="31" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#0a796a">MECHANICAL SYSTEM   /   MOTION STUDY</text><text x="24" y="67" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#193742">Drive A   CW</text><text x="24" y="96" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#193742">Find B (spin) at the shown instant.</text><text x="24" y="123" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">CW = clockwise in the marked view. Matching letters denote one body.</text><text x="24" y="146" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">Detail views use pitch outlines. Only the labeled joints transmit motion.</text><rect x="24" y="178" width="446" height="119" rx="4" fill="#f1f5f1" stroke="none"/><g transform="translate(24 191) scale(.86)"><path d="M110 100 L110 18" stroke="#b56426" stroke-width="17" fill="none"/><path d="M110 89 L110 25" stroke="#fffefa" stroke-width="8" fill="none"/><circle cx="110" cy="100" r="5" fill="#fffefa" stroke="#193742" stroke-width="2"/><path d="M110 78 L110 44" stroke="#0a796a" stroke-width="7" fill="none"/><circle cx="110" cy="78" r="5" fill="#fffefa" stroke="#193742" stroke-width="2"/><circle cx="110" cy="44" r="5" fill="#fffefa" stroke="#193742" stroke-width="2"/><text x="52" y="102" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">A</text><text x="168" y="71" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">B</text></g><text x="203" y="202" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#0a796a">Slotted rocker</text><text x="203" y="226" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">Pin atop crank A rides a radial</text><text x="203" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">slot above pivot B. Both arms</text><text x="203" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">point up at this instant.</text><path d="M24 324 L616 324" stroke="#b5c9c3" stroke-width="1" fill="none"/><text x="27" y="356" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#b56426">A</text><text x="57" y="356" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">CCW</text><text x="27" y="384" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#b56426">B</text><text x="57" y="384" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">translates</text><text x="27" y="412" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#b56426">C</text><text x="57" y="412" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">stationary</text><text x="27" y="440" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#b56426">D</text><text x="57" y="440" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">CW</text></svg>
