<svg xmlns="http://www.w3.org/2000/svg" width="640" height="474" viewBox="0 0 640 474"><rect x="0" y="0" width="640" height="474" rx="4" fill="#fffefa" stroke="none"/><text x="24" y="31" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#0a796a">MECHANICAL SYSTEM   /   MOTION STUDY</text><text x="24" y="67" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#193742">Drive A   CW</text><text x="24" y="96" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#193742">Find B (cycle) over a complete turn.</text><text x="24" y="123" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">CW = clockwise in the marked view. Matching letters denote one body.</text><text x="24" y="146" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">Detail views use pitch outlines. Only the labeled joints transmit motion.</text><rect x="24" y="178" width="446" height="119" rx="4" fill="#f1f5f1" stroke="none"/><g transform="translate(24 191) scale(.86)"><rect x="100" y="18" width="20" height="67" rx="4" fill="#f0c798" stroke="#193742"/><rect x="106" y="23" width="8" height="57" rx="4" fill="#fffefa" stroke="none"/><path d="M121 51 L182 51" stroke="#b56426" stroke-width="7" fill="none"/><path d="M154 45 L182 45" stroke="#193742" stroke-width="3" fill="none"/><path d="M154 57 L182 57" stroke="#193742" stroke-width="3" fill="none"/><path d="M110 78 L110 44" stroke="#0a796a" stroke-width="7" fill="none"/><circle cx="110" cy="78" r="5" fill="#fffefa" stroke="#193742" stroke-width="2"/><circle cx="110" cy="44" r="5" fill="#fffefa" stroke="#193742" stroke-width="2"/><text x="52" y="102" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">A</text><text x="168" y="71" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">B</text></g><text x="203" y="202" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#0a796a">Captive yoke</text><text x="203" y="226" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">Top pin on crank A rides the</text><text x="203" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">vertical slot of horizontal yoke B.</text><text x="203" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#193742">Throw radius 12 mm.</text><path d="M24 324 L616 324" stroke="#b5c9c3" stroke-width="1" fill="none"/><text x="27" y="356" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#b56426">A</text><text x="57" y="356" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">horizontal reciprocation</text><text x="27" y="384" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#b56426">B</text><text x="57" y="384" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">continuous rotation</text><text x="27" y="412" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#b56426">C</text><text x="57" y="412" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">vertical reciprocation</text><text x="27" y="440" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#b56426">D</text><text x="57" y="440" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#193742">stationary</text></svg>
